<ng-template #modalLightbox>
  <div
    class="fixed inset-0 z-[99999] flex flex-col justify-between p-3 sm:p-6 text-white select-none animate-fade-scale"
    (click)="cerrar()"
    (document:keydown.escape)="cerrar()">

    <!-- Top Bar Header con Botonera Prominente -->
    <div
      class="flex flex-wrap items-center justify-between gap-2 sm:gap-4 bg-black/85 backdrop-blur-md border border-white/20 px-3 py-2.5 sm:px-5 sm:py-3 rounded-2xl shadow-lifted z-30"
      (click)="$event.stopPropagation()">

      <div class="flex items-center gap-2 min-w-0 pr-2">
        <app-icon name="image" [size]="20" class="text-secondary shrink-0" />
        <span class="text-xs sm:text-sm font-bold text-white truncate">
          {{ title() || 'Visor de Imagen' }}
        </span>
      </div>

      <!-- Botones de Acción -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">

        <!-- Controles Zoom -->
        <button
          type="button"
          (click)="zoomOut()"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer transition-all border border-white/10"
          title="Reducir zoom">
          <app-icon name="zoom-out" [size]="18" />
        </button>

        <button
          type="button"
          (click)="resetTransform()"
          class="px-2.5 h-9 sm:h-10 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-mono font-bold text-white flex items-center justify-center cursor-pointer transition-all border border-white/10"
          title="Restablecer tamaño (100%)">
          {{ (zoom() * 100).toFixed(0) }}%
        </button>

        <button
          type="button"
          (click)="zoomIn()"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer transition-all border border-white/10"
          title="Aumentar zoom">
          <app-icon name="zoom-in" [size]="18" />
        </button>

        <!-- Girar 90° -->
        <button
          type="button"
          (click)="rotateRight()"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer transition-all border border-white/10"
          title="Girar 90°">
          <app-icon name="rotate-cw" [size]="18" />
        </button>

        <div class="w-px h-6 bg-white/20 my-auto hidden xs:block"></div>

        <!-- Descargar -->
        <button
          type="button"
          (click)="descargarImagen()"
          [disabled]="descargando()"
          class="px-3.5 h-9 sm:h-10 rounded-xl bg-primary hover:opacity-90 text-white text-xs font-bold flex items-center gap-1.5 shadow-subtle cursor-pointer transition-all disabled:opacity-50"
          title="Descargar imagen">
          @if (descargando()) {
            <app-icon name="loader" [size]="16" class="animate-spin text-white" />
          } @else {
            <app-icon name="download" [size]="16" />
          }
          <span class="hidden sm:inline">Descargar</span>
        </button>

        <!-- Compartir por WhatsApp -->
        <button
          type="button"
          (click)="compartirImagen()"
          class="px-3.5 h-9 sm:h-10 rounded-xl bg-secondary hover:opacity-90 text-white text-xs font-bold flex items-center gap-1.5 shadow-subtle cursor-pointer transition-all"
          title="Compartir por WhatsApp / Móvil">
          <app-icon name="share-2" [size]="16" />
          <span class="hidden sm:inline">Compartir</span>
        </button>

        <div class="w-px h-6 bg-white/20 my-auto"></div>

        <!-- Cerrar -->
        <button
          type="button"
          (click)="cerrar()"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/20 hover:bg-white/30 text-white flex items-center justify-center cursor-pointer transition-all border border-white/20"
          title="Cerrar (Esc)">
          <app-icon name="x" [size]="20" />
        </button>
      </div>
    </div>

    <!-- Contenedor Central de Imagen -->
    <div
      class="flex-1 flex items-center justify-center overflow-hidden my-3 cursor-zoom-out"
      (click)="cerrar()">
      @if (imageUrl(); as imgUrl) {
        <img
          [src]="imgUrl"
          (click)="$event.stopPropagation()"
          alt="Vista previa de foto"
          [style.transform]="'scale(' + zoom() + ') rotate(' + rotation() + 'deg)'"
          class="max-w-[94vw] max-h-[82vh] object-contain rounded-2xl shadow-lifted transition-transform duration-200 ease-out select-none" />
      }
    </div>
  </div>
</ng-template>
