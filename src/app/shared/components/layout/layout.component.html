<div class="layout-grid">

  <!-- ══════════════════════════════════════════════════════════════════════
       TOPBAR — Barra superior compacta (64px)
       Ref: CRM_MANIFESTO.md §3.2
       ══════════════════════════════════════════════════════════════════════ -->
  <header class="topbar flex items-center justify-between bg-white border-b border-border px-6">

    <!-- Logo interactivo (único botón para contraer/expandir el menú) -->
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="toggleSidebar($event)"
        class="logo-toggle-btn p-1.5 -ml-1.5 rounded-xl hover:bg-bg-light
               transition-all duration-200 cursor-pointer border border-transparent hover:border-border"
        title="Hacer clic en el logo para abrir / cerrar el menú"
        aria-label="Toggle menú de navegación">
        <img src="/favicon.svg" alt="Montalvo Logo" class="w-10 h-10 object-contain transition-transform duration-200 hover:scale-105" />
      </button>

      <span class="text-base font-bold text-text-dark tracking-tight flex items-center gap-2">
        Clínica Montalvo
        <span class="text-xs font-semibold text-primary bg-primary/10 px-2 py-0.5 rounded-md">CRM</span>
      </span>
    </div>

    <!-- Acciones — perfil + logout -->
    <div class="flex items-center gap-3">
      @if (user(); as currentUser) {
        <div class="flex items-center gap-3">
          <a routerLink="/perfil" class="flex items-center gap-3 hover:opacity-90 transition-opacity cursor-pointer group" title="Ver mi perfil">
            <app-avatar [initials]="currentUser.iniciales" [imageUrl]="currentUser.foto" size="sm" />
            <div class="hidden lg:block">
              <p class="text-sm font-medium text-text-dark leading-tight group-hover:text-primary transition-colors">
                {{ currentUser.nombre }}
              </p>
              <p class="text-[11px] text-text-muted leading-tight">
                {{ currentUser.rol === 'ADMIN' ? 'Administrador' : 'Agente' }}
              </p>
            </div>
          </a>
          <button
            type="button"
            (click)="logout()"
            class="w-8 h-8 rounded-lg flex items-center justify-center text-text-muted
                   hover:text-primary hover:bg-bg-light transition-all duration-200 cursor-pointer"
            title="Cerrar sesión"
            aria-label="Cerrar sesión">
            <app-icon name="log-out" [size]="16" />
          </button>
        </div>
      }
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════════════════
       SIDEBAR — Icon Rail (72px) → Expandible al hover (240px)
       Ref: CRM_MANIFESTO.md §3.2
       ══════════════════════════════════════════════════════════════════════ -->
  <aside class="sidebar" [class.sidebar-expanded]="sidebarExpanded()">
    <div class="sidebar-inner py-4" [class.sidebar-inner-expanded]="sidebarExpanded()">
      <!-- Navigation -->
      <nav class="flex flex-col gap-1 px-3 flex-1" aria-label="Navegación principal">
        @for (item of navItems(); track item.path) {
          <a [routerLink]="item.path"
             routerLinkActive="nav-active"
             class="nav-link">
            <span class="nav-icon-slot">
              <app-icon [name]="item.icon" [size]="20" />
            </span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>
    </div>
  </aside>

  <!-- ══════════════════════════════════════════════════════════════════════
       WORKSPACE — Contenedor principal con <router-outlet>
       Ref: CRM_MANIFESTO.md §3.2 — bg alternativo
       ══════════════════════════════════════════════════════════════════════ -->
  <main class="workspace bg-bg-workspace overflow-y-auto">
    <div class="p-6 pb-28">
      <router-outlet />
    </div>
  </main>

</div>

<!-- ══════════════════════════════════════════════════════════════════════
     FAB & TOASTS — Acciones rápidas flotantes y notificaciones globales
     ══════════════════════════════════════════════════════════════════════ -->
<app-fab-menu [items]="fabItems" />
<app-toast-container />
