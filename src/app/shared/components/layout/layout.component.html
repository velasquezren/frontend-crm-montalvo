<div class="layout-grid">

  <!-- ══════════════════════════════════════════════════════════════════════
       TOPBAR — Barra superior sticky (80px)
       Ref: CRM_MANIFESTO.md §3.2
       ══════════════════════════════════════════════════════════════════════ -->
  <header class="topbar flex items-center justify-between bg-white border-b border-border px-8">

    <!-- Logo -->
    <div class="logo-container flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shrink-0">
        <span class="text-white text-sm font-bold leading-none">CM</span>
      </div>
      <div>
        <p class="text-base font-semibold text-text-dark leading-tight">Clínica Montalvo</p>
        <p class="text-xs text-text-muted leading-tight">Sistema CRM</p>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex items-center gap-4">
      <!-- Botón Registrar Atención — §3.2: rounded-full (píldora), bg-primary -->
      <button
        type="button"
        class="flex items-center gap-2 bg-primary text-white font-semibold rounded-full
               px-5 py-2.5 text-sm hover:opacity-90 transition-all duration-200 cursor-pointer
               shadow-subtle">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="M12 5v14"/>
        </svg>
        <span class="hidden md:inline">Registrar Atención Presencial</span>
      </button>

      <!-- Separador vertical -->
      <div class="h-8 w-px bg-border"></div>

      <!-- Perfil del Agente — AuthService.user signal -->
      @if (user(); as currentUser) {
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-bg-light flex items-center justify-center shrink-0">
            <span class="text-sm font-semibold text-primary leading-none">{{ currentUser.iniciales }}</span>
          </div>
          <div class="hidden lg:block">
            <p class="text-sm font-medium text-text-dark leading-tight">{{ currentUser.nombre }}</p>
            <p class="text-xs text-text-muted leading-tight">
              {{ currentUser.rol === 'admin' ? 'Administrador' : 'Agente' }}
            </p>
          </div>
          <!-- Botón Cerrar Sesión -->
          <button
            type="button"
            (click)="logout()"
            class="w-9 h-9 rounded-xl flex items-center justify-center text-text-muted
                   hover:text-primary hover:bg-bg-light transition-all duration-200 cursor-pointer"
            title="Cerrar sesión">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <!-- LogOut -->
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" x2="9" y1="12" y2="12"/>
            </svg>
          </button>
        </div>
      }
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════════════════
       SIDEBAR — Navegación vertical (272px)
       Ref: CRM_MANIFESTO.md §3.2 — bg-white, borde derecho sutil
       ══════════════════════════════════════════════════════════════════════ -->
  <aside class="sidebar bg-white border-r border-border overflow-y-auto">
    <nav class="flex flex-col gap-1 px-4 py-6" aria-label="Navegación principal">

      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path"
           routerLinkActive="nav-active"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium
                  text-text-muted transition-all duration-200 hover:text-primary hover:bg-bg-light
                  no-underline">

          <!-- Icono SVG Lucide-style (outline, 20×20) -->
          <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">

            @switch (item.icon) {
              @case ('dashboard') {
                <!-- LayoutDashboard -->
                <rect x="3" y="3" width="7" height="9" rx="1"/>
                <rect x="14" y="3" width="7" height="5" rx="1"/>
                <rect x="14" y="12" width="7" height="9" rx="1"/>
                <rect x="3" y="16" width="7" height="5" rx="1"/>
              }
              @case ('users') {
                <!-- Users -->
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              }
              @case ('user-plus') {
                <!-- UserPlus -->
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <line x1="19" x2="19" y1="8" y2="14"/>
                <line x1="22" x2="16" y1="11" y2="11"/>
              }
              @case ('message-circle') {
                <!-- MessageCircle -->
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
              }
              @case ('shopping-bag') {
                <!-- ShoppingBag -->
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              }
              @case ('wallet') {
                <!-- Wallet -->
                <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
              }
            }
          </svg>

          <span>{{ item.label }}</span>
        </a>
      }

    </nav>
  </aside>

  <!-- ══════════════════════════════════════════════════════════════════════
       WORKSPACE — Contenedor principal con <router-outlet>
       Ref: CRM_MANIFESTO.md §3.2 — bg alternativo, paddings generosos
       ══════════════════════════════════════════════════════════════════════ -->
  <main class="workspace bg-bg-workspace overflow-y-auto">
    <div class="p-8">
      <router-outlet />
    </div>
  </main>

</div>
