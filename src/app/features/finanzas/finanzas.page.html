<div class="finanzas-contenedor">
  <!-- ── Encabezado Unificado del Hub ─────────────────────────────────── -->
  <header class="finanzas-header-wrapper">
    <div class="flex items-center justify-between gap-4 flex-wrap pb-1">
      <app-page-header
        title="Finanzas & Comisiones"
        subtitle="Liquidación mensual de comisiones, analítica de facturación médica y balance anual" />
      <div class="flex items-center gap-2">
      </div>
    </div>

    <!-- ── Barra de Pestañas Segmentadas ──────────────────────────────── -->
    <nav class="finanzas-tabs-bar" role="tablist" aria-label="Secciones de Finanzas">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="tabActiva() === t.id"
          [attr.aria-controls]="'panel-' + t.id"
          [id]="'tab-' + t.id"
          (click)="cambiarTab(t.id)"
          (mouseenter)="precargarTab(t.id)"
          (focus)="precargarTab(t.id)"
          class="finanzas-tab-btn"
          [class.finanzas-tab-btn--active]="tabActiva() === t.id">
          <app-icon [name]="t.icon" [size]="16" class="tab-icono" />
          <span class="tab-label">{{ t.label }}</span>
        </button>
      }
    </nav>
  </header>

  <!-- ── Vistas: se montan al visitarlas y se quedan montadas ──────────
       `@if` decide si el componente EXISTE (y por tanto si pide datos); la
       clase `--oculto` decide si se ve. Antes solo estaba el `@if`, así que las
       cuatro pantallas pedían sus datos al entrar aunque se mirase una.

       **No se usa `[hidden]` (o sea `display: none`) a propósito**: sacar del
       renderizado un panel ya montado obliga al navegador a rehacerle el
       layout entero al volver, reinicia las animaciones CSS de dentro (las
       porciones de las donas de Analítica se redibujaban desde cero en cada
       visita), pierde el scroll horizontal de la matriz de doce meses y hace
       que un `@defer (on viewport)` se dispare justo al mostrar la pestaña.
       Eso es el parpadeo. Con `visibility: hidden` fuera de flujo el panel
       conserva su layout y su estado de pintado, así que volver a él no
       redibuja nada — y sigue fuera del árbol de accesibilidad y del orden de
       tabulación, que es lo que daba `hidden`. -->
  <main class="finanzas-cuerpo">
    @if (estaMontada('liquidacion')) {
      <div
        id="panel-liquidacion"
        aria-labelledby="tab-liquidacion"
        class="finanzas-tab-panel"
        [class.finanzas-tab-panel--oculto]="tabActiva() !== 'liquidacion'"
        [attr.inert]="tabActiva() === 'liquidacion' ? null : ''"
        role="tabpanel">
        <app-planilla-comisiones [embedded]="true" [activo]="tabActiva() === 'liquidacion'" />
      </div>
    }

    @if (estaMontada('agentes')) {
      <div
        id="panel-agentes"
        aria-labelledby="tab-agentes"
        class="finanzas-tab-panel"
        [class.finanzas-tab-panel--oculto]="tabActiva() !== 'agentes'"
        [attr.inert]="tabActiva() === 'agentes' ? null : ''"
        role="tabpanel">
        <app-desempeno-agentes [embedded]="true" [activo]="tabActiva() === 'agentes'" />
      </div>
    }

    @if (estaMontada('analitica')) {
      <div
        id="panel-analitica"
        aria-labelledby="tab-analitica"
        class="finanzas-tab-panel"
        [class.finanzas-tab-panel--oculto]="tabActiva() !== 'analitica'"
        [attr.inert]="tabActiva() === 'analitica' ? null : ''"
        role="tabpanel">
        <app-analitica [embedded]="true" />
      </div>
    }

    @if (estaMontada('anual')) {
      <div
        id="panel-anual"
        aria-labelledby="tab-anual"
        class="finanzas-tab-panel"
        [class.finanzas-tab-panel--oculto]="tabActiva() !== 'anual'"
        [attr.inert]="tabActiva() === 'anual' ? null : ''"
        role="tabpanel">
        <app-resumen-anual [embedded]="true" />
      </div>
    }

    @if (estaMontada('tipo-cambio')) {
      <div
        id="panel-tipo-cambio"
        aria-labelledby="tab-tipo-cambio"
        class="finanzas-tab-panel"
        [class.finanzas-tab-panel--oculto]="tabActiva() !== 'tipo-cambio'"
        [attr.inert]="tabActiva() === 'tipo-cambio' ? null : ''"
        role="tabpanel">
        <app-tipo-cambio-admin />
      </div>
    }
  </main>
</div>
