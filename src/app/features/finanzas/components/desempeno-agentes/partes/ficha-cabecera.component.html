@let v = fila();

<section class="panel-ficha">
  <div class="identidad">
    <app-avatar [initials]="iniciales()" size="lg" />

    <div class="min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <h2 class="text-base font-bold text-text-dark tracking-tight truncate">{{ v.nombre }}</h2>
        <app-badge [variant]="v.tipo === 'JEFA' ? 'info' : 'neutral'">{{ v.tipo }}</app-badge>
        <span class="etiqueta-area">{{ v.area }}</span>
        <span class="text-xs font-mono text-text-muted">{{ v.codigo }}</span>
      </div>

      <dl class="datos-secundarios">
        <div>
          <dt>Sueldo base</dt>
          <!-- 'BOB' obligatorio: el sueldo ya está en bolivianos. -->
          <dd>{{ v.sueldoBase | moneda: 'BOB' }}</dd>
        </div>
        <div>
          <dt>Facturado del mes</dt>
          <dd>{{ v.montoVendido | moneda }}</dd>
        </div>
      </dl>
    </div>
  </div>

  <div class="caja-total">
    <span class="caja-total-etiqueta">Total a transferir</span>
    <!-- 'BOB' obligatorio: totalGanado = totalBob + sueldoBase, los dos en Bs. -->
    <span class="caja-total-monto tabular-nums">{{ v.totalGanado | moneda: 'BOB' }}</span>
    <span class="caja-total-pie">
      {{ v.totalUsd | moneda }} de comisiones + sueldo
    </span>
  </div>
</section>
