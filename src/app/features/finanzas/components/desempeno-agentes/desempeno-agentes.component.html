<app-page-header
  title="Desempeño de Agentes"
  subtitle="Por qué cada ejecutiva cobró lo que cobró: metas, tramos y composición del pago" />

<!-- ── Barra de control: periodo y ejecutiva ─────────────────────────── -->
<div class="barra-control">
  <div class="flex items-center gap-3 min-w-0 flex-wrap">
    <span class="icono-periodo">
      <app-icon name="calendar" [size]="18" />
    </span>

    @if (periodos.isLoading()) {
      <app-loading-skeleton width="200px" height="36px" />
    } @else {
      <span class="envoltura-select">
        <select
          class="select-periodo"
          aria-label="Periodo a consultar"
          [value]="periodoId() || ''"
          (change)="elegirPeriodo($any($event.target).value)">
          @for (p of periodos.value()?.datos ?? []; track p.id) {
            <option [value]="p.id" [selected]="p.id === periodoId()">
              {{ nombreMes(p.mes) }} {{ p.anio }} — {{ etiquetaEstado(p.estado) }}
            </option>
          }
        </select>
        <app-icon name="chevron-down" [size]="16" class="flecha-select" />
      </span>
    }

    @if (periodo(); as p) {
      <span class="pildora-tc" title="Tipo de cambio con el que se liquidó este mes">
        TC {{ p.tipoCambio }}
      </span>
    }
  </div>

  @if (vendedoras().length > 0) {
    <div class="flex items-center gap-1.5 flex-wrap">
      @for (v of vendedoras(); track v.vendedoraId) {
        <app-filter-chip
          [active]="vendedora()?.vendedoraId === v.vendedoraId"
          size="sm"
          (clicked)="elegirVendedora(v.vendedoraId)">
          {{ v.nombre }}
        </app-filter-chip>
      }
    </div>
  }
</div>

@if (consolidado.isLoading()) {
  <div class="flex flex-col gap-4">
    <app-loading-skeleton height="104px" />
    <app-loading-skeleton height="196px" />
    <app-loading-skeleton height="260px" />
  </div>
} @else if (consolidado.error()) {
  <app-error-carga que="el desempeño de las ejecutivas" (reintentar)="consolidado.reload()" />
} @else if (vendedora(); as v) {
  <div class="ficha animate-fade-scale">
    <app-ficha-cabecera [fila]="v" />

    <app-metas-agente [fila]="v" [metas]="metas()" [tramos]="tramos()" />

    <app-composicion-pago [fila]="v" [tipoCambio]="tipoCambio()" />

    <app-ventas-agente
      [ventas]="ventasDelMes()"
      [cargando]="ventas.isLoading()"
      [codigoVendedora]="v.codigo"
      [canales]="canales()" />
  </div>
} @else {
  <app-empty-state
    icon="users"
    title="Sin liquidación calculada"
    description="Calcula la planilla de este periodo para ver el desempeño de las ejecutivas." />
}
