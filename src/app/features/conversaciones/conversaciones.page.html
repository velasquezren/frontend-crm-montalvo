<!-- ═══════════════════════════════════════════════════════════════
     WhatsApp Inbox Premium — Arquitectura Modular
     Tres paneles: lista filtrable · chat con separadores · ficha + asignación
     ═══════════════════════════════════════════════════════════════ -->
<div class="inbox-wrapper"
     [class.has-details]="!!state.seleccionadaId()"
     [class.panel-open]="!!state.detalle.value() && state.panelAbierto()"
     [class.panel-collapsed]="!!state.detalle.value() && !state.panelAbierto()">

  <!-- ── Panel izquierdo: lista de chats ──────────────────────────── -->
  <app-conversacion-lista />

  <!-- ── Panel central: conversación activa ───────────────────────── -->
  <section class="chat-panel">
    <app-conversacion-thread />
    @if (state.detalle.value()) {
      <app-conversacion-composer />
    }
  </section>

  <!-- ── Panel derecho: ficha del cliente + asignación ─────────────── -->
  <app-conversacion-sidebar />

</div>
