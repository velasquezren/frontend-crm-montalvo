<!-- ══════════════════════════════════════════════════════════════════════
     Campañas — a quién escribirle, qué se le mandó y qué logró.
     Dos pestañas de un mismo trabajo; cada una es su componente.
     ══════════════════════════════════════════════════════════════════════ -->
<div class="flex flex-col gap-5 w-full">
  <header class="flex flex-col gap-3.5">
    <app-page-header
      title="Campañas"
      subtitle="Mensajes de Marketing por WhatsApp: a quién escribirle hoy, y qué logró cada envío." />

    <nav class="crm-segmento crm-segmento-pestanas" role="tablist" aria-label="Secciones de Campañas">
      @for (t of tabs; track t.id) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="tabActiva() === t.id"
          [attr.aria-controls]="'panel-' + t.id"
          [id]="'tab-' + t.id"
          (click)="cambiarTab(t.id)"
          class="crm-segmento-opcion"
          [class.crm-segmento-opcion-activo]="tabActiva() === t.id">
          <app-icon [name]="t.icon" [size]="14" />
          <span>{{ t.label }}</span>
        </button>
      }
    </nav>
  </header>

  <!-- `@if` decide si la pestaña EXISTE (y pide sus datos); la clase decide si
       se ve. Ver `.crm-pestana-panel-oculta` en styles.css. -->
  <main class="crm-pestanas-cuerpo">
    @if (estaMontada('campanas')) {
      <div
        id="panel-campanas"
        aria-labelledby="tab-campanas"
        class="crm-pestana-panel"
        [class.crm-pestana-panel-oculta]="tabActiva() !== 'campanas'"
        [attr.inert]="tabActiva() === 'campanas' ? null : ''"
        role="tabpanel">
        <app-campanas-lista (armarAudiencia)="cambiarTab('audiencia')" />
      </div>
    }

    @if (estaMontada('audiencia')) {
      <div
        id="panel-audiencia"
        aria-labelledby="tab-audiencia"
        class="crm-pestana-panel"
        [class.crm-pestana-panel-oculta]="tabActiva() !== 'audiencia'"
        [attr.inert]="tabActiva() === 'audiencia' ? null : ''"
        role="tabpanel">
        <app-campana-audiencia (creada)="alCrearCampana($event)" />
      </div>
    }
  </main>
</div>
