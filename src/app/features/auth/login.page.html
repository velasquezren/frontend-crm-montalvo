<!-- ═══════════════════════════════════════════════════════════════
     Login Page — Minimalist Edition
     Ref: CRM_MANIFESTO.md §3.1, §3.2, §3.3 (Minimalismo Orgánico & Premium)
     ═══════════════════════════════════════════════════════════════ -->
<div class="login-wrapper min-h-dvh flex items-center justify-center p-4 bg-bg-workspace relative">
  <!-- Subtle Ambient Background Light -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32rem] h-[32rem] bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Minimalist Card -->
  <div class="login-card w-full max-w-md bg-white rounded-2xl shadow-subtle border border-border/80 p-8 lg:p-10 relative z-10">

    <!-- ── Brand Header & Logo ── -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-bg-light border border-primary/15 p-2.5 flex items-center justify-center mb-4 shadow-sm">
        <img src="/favicon.svg" alt="Montalvo Logo" class="w-full h-full object-contain" />
      </div>
      <h1 class="text-xl font-bold text-text-dark tracking-tight">Acceso al Sistema</h1>
      <p class="text-xs text-text-muted mt-1 font-normal">CRM Montalvo</p>
    </div>

    <!-- ── Error Alert ── -->
    @if (errorMessage()) {
      <div class="mb-6 p-3.5 rounded-xl bg-critical-bg border border-critical/20 text-xs text-text-dark font-medium flex items-center gap-2.5 animate-fade-scale">
        <app-icon name="alert-circle" [size]="16" class="text-critical shrink-0" />
        <span class="flex-1">{{ errorMessage() }}</span>
      </div>
    }

    <!-- ── Form ── -->
    <form (submit)="onSubmit($event)" class="space-y-4">
      <app-input
        label="Correo electrónico"
        type="email"
        placeholder="tu.nombre@empresa.com"
        autocomplete="email"
        [(value)]="email" />

      <app-input
        label="Contraseña"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        [(value)]="password" />

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-text-dark cursor-pointer select-none">
          <input
            type="checkbox"
            [checked]="rememberMe()"
            (change)="rememberMe.set($any($event.target).checked)"
            class="w-4 h-4 rounded border-border text-primary focus:ring-primary/20 accent-primary cursor-pointer" />
          <span class="text-text-muted">Recordarme</span>
        </label>
        <span class="text-text-muted hover:text-primary transition-colors text-xs cursor-not-allowed" title="Contacta al administrador para restablecer acceso">
          ¿Olvidaste tu clave?
        </span>
      </div>

      <div class="pt-2">
        <app-button
          type="submit"
          [loading]="isLoading()"
          [fullWidth]="true"
          size="md">
          {{ isLoading() ? 'Ingresando...' : 'Ingresar' }}
        </app-button>
      </div>
    </form>

    <!-- ── Quick Fill Helpers ── -->
    <div class="mt-8 pt-6 border-t border-border/60">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] text-text-muted font-medium">Credenciales de prueba:</span>
        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="fillDemoCredentials('admin')"
            class="px-2.5 py-1 text-[11px] font-medium rounded-lg border border-border bg-bg-workspace text-text-dark hover:border-primary/40 hover:bg-bg-light transition-all cursor-pointer">
            Admin
          </button>
          <button
            type="button"
            (click)="fillDemoCredentials('agente')"
            class="px-2.5 py-1 text-[11px] font-medium rounded-lg border border-border bg-bg-workspace text-text-dark hover:border-primary/40 hover:bg-bg-light transition-all cursor-pointer">
            Agente
          </button>
        </div>
      </div>
    </div>

    <!-- ── Footer ── -->
    <p class="text-center text-[11px] text-text-muted mt-6">
      Sistema exclusivo para personal autorizado
    </p>

  </div>
</div>
