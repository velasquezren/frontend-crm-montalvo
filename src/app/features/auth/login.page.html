<!-- ═══════════════════════════════════════════════════════════════
     Login Page — Clínica Montalvo CRM
     Ref: CRM_MANIFESTO.md §3.1, §3.2, §3.3
     ═══════════════════════════════════════════════════════════════ -->
<div class="min-h-dvh bg-bg-workspace flex items-center justify-center p-4">

  <!-- Login Card — §3.2: rounded-2xl (16px), shadow-subtle -->
  <div class="login-card w-full max-w-md bg-white rounded-2xl shadow-subtle p-10">

    <!-- ── Branding ─────────────────────────────────────────── -->
    <div class="flex flex-col items-center mb-10">
      <div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center mb-4">
        <span class="text-white text-xl font-bold leading-none">CM</span>
      </div>
      <h1 class="text-2xl font-bold text-text-dark tracking-tight">Clínica Montalvo</h1>
      <p class="text-sm text-text-muted mt-1">Acceso al Sistema CRM</p>
    </div>

    <!-- ── Error Message ────────────────────────────────────── -->
    @if (errorMessage()) {
      <div class="mb-6 px-4 py-3 rounded-xl bg-bg-workspace border border-text-muted/20
                  text-sm text-text-dark font-medium flex items-center gap-2">
        <svg class="w-4 h-4 text-text-muted shrink-0" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" x2="12" y1="8" y2="12"/>
          <line x1="12" x2="12.01" y1="16" y2="16"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }

    <!-- ── Login Form ───────────────────────────────────────── -->
    <form (submit)="onSubmit($event)" class="flex flex-col gap-5">

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label for="login-email" class="text-sm font-medium text-text-dark">
          Correo electrónico
        </label>
        <input
          id="login-email"
          type="email"
          placeholder="tu.nombre@clinicamontalvo.com"
          [value]="email()"
          (input)="onEmailInput($event)"
          autocomplete="email"
          class="input-field"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <label for="login-password" class="text-sm font-medium text-text-dark">
          Contraseña
        </label>
        <input
          id="login-password"
          type="password"
          placeholder="••••••••"
          [value]="password()"
          (input)="onPasswordInput($event)"
          autocomplete="current-password"
          class="input-field"
        />
      </div>

      <!-- Submit Button — §3.2: rounded-full (píldora), bg-primary -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full py-3 mt-2 bg-primary text-white font-semibold rounded-full text-sm
               hover:opacity-90 transition-all duration-200 cursor-pointer
               disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <span class="inline-flex items-center justify-center gap-2">
            <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
            Ingresando...
          </span>
        } @else {
          Ingresar
        }
      </button>
    </form>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <p class="text-center text-xs text-text-muted mt-8">
      Sistema exclusivo para personal autorizado
    </p>
  </div>
</div>
