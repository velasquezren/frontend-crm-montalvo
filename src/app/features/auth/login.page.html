<!-- ═══════════════════════════════════════════════════════════════
     Login Page — CRM
     Ref: CRM_MANIFESTO.md §3.1, §3.2, §3.3, §4 (construida sobre átomos)
     ═══════════════════════════════════════════════════════════════ -->
<div class="login-bg min-h-dvh bg-bg-workspace flex items-center justify-center p-4">

  <app-card padding="lg" class="login-card w-full max-w-md">

    <!-- ── Branding — slot vacío para el logo definitivo del cliente ─ -->
    <div class="flex flex-col items-center mb-10">
      <p class="text-3xl font-bold text-primary tracking-tight leading-none mb-3">CRM</p>
      <h1 class="text-xl font-semibold text-text-dark tracking-tight">Acceso al Sistema</h1>
      <p class="text-sm text-text-muted mt-1">Ingresa con tu cuenta de agente</p>
    </div>

    <!-- ── Error Message ────────────────────────────────────── -->
    @if (errorMessage()) {
      <div class="mb-6 px-4 py-3 rounded-xl bg-critical-bg text-sm text-text-dark font-medium
                  flex items-center gap-2">
        <app-icon name="alert-circle" [size]="16" class="text-critical shrink-0" />
        {{ errorMessage() }}
      </div>
    }

    <!-- ── Login Form ───────────────────────────────────────── -->
    <form (submit)="onSubmit($event)" class="flex flex-col gap-5">

      <app-input
        label="Correo electrónico"
        type="email"
        placeholder="tu.nombre@empresa.com"
        autocomplete="email"
        [(value)]="email" />

      <app-input
        label="Contraseña"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        [(value)]="password" />

      <app-button type="submit" [loading]="isLoading()" [fullWidth]="true" class="mt-2">
        {{ isLoading() ? 'Ingresando...' : 'Ingresar' }}
      </app-button>
    </form>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <p class="text-center text-xs text-text-muted mt-8">
      Sistema exclusivo para personal autorizado
    </p>
  </app-card>
</div>
