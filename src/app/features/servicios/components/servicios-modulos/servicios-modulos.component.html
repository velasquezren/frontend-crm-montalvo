<div class="flex items-center justify-between mb-4 flex-wrap gap-2">
  <div>
    <h3 class="titulo-seccion">Servicios por módulo</h3>
    <p class="subtitulo-seccion">Toca cualquier módulo para filtrar el dashboard completo</p>
  </div>
  @if (filtroModulo(); as m) {
    <app-button variant="ghost" size="sm" icon="x" (clicked)="alternarModulo.emit(m)">
      Quitar filtro ({{ m }})
    </app-button>
  }
</div>

<div class="grid-split">
  <app-donut-chart etiquetaTotal="servicios" formatType="number" [items]="serieModulos()" />

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (m of desgloseModulos(); track m.etiqueta) {
      <button
        type="button"
        class="sub-card text-left cursor-pointer"
        [class.sub-card--active]="filtroModulo() === m.etiqueta"
        (click)="alternarModulo.emit(m.etiqueta)">
        <div class="flex items-center justify-between mb-3">
          <app-badge [variant]="filtroModulo() === m.etiqueta ? 'success' : 'neutral'">
            {{ m.etiqueta }}
          </app-badge>
          <span class="badge-pct">{{ m.pct }}%</span>
        </div>
        <div>
          <span class="sub-card-cifra">{{ m.total | number }}</span>
          <span class="sub-card-pie">{{ m.ingreso | moneda }} facturado</span>
        </div>
      </button>
    }
  </div>
</div>
