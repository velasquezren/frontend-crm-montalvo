<!-- Una sola superficie: el calendario y su leyenda son la misma tarjeta, con la
     geometría del sistema (rounded-2xl + border-border + shadow-subtle). Antes la
     leyenda era una fila suelta encima, que flotaba sin pertenecer a nada. -->
<section class="crm-calendario">
  <div class="px-3.5 py-2 border-b border-border text-xs text-text-muted">Hora de Bolivia · Selecciona una actividad para ver su detalle</div>
  <div class="crm-calendario-lienzo">
    <sx-calendar [calendarApp]="calendarApp" />
  </div>

  <footer class="crm-calendario-leyenda" aria-hidden="true">
    @for (tono of tonos; track tono.id) {
      <span class="crm-leyenda-item">
        <span class="crm-leyenda-punto" [style.background]="tono.color"></span>
        {{ tono.etiqueta }}
      </span>
    }
  </footer>
</section>
