<div class="max-w-3xl mx-auto space-y-6">

  <app-page-header
    title="Mi Perfil"
    subtitle="Personaliza tus datos de agente y foto de presentación para el panel de administración." />

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- ── Panel de Avatar / Foto ───────────────────────────────────── -->
    <div class="bg-white rounded-2xl border border-border p-6 flex flex-col items-center text-center space-y-4 shadow-xs">
      <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider">Foto de Perfil</h3>

      <div class="relative group cursor-pointer" (click)="triggerFileInput()">
        <app-avatar
          [initials]="iniciales()"
          [imageUrl]="previewFoto()"
          size="lg" />

        <div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-200">
          <app-icon name="image" class="text-white" [size]="20" />
        </div>
      </div>

      <input
        #fileInput
        type="file"
        class="hidden"
        accept="image/*"
        (change)="onFileSelected($event)" />

      <div class="space-y-1">
        <p class="text-xs text-text-muted">Formatos: JPG, PNG o WEBP.</p>
        <p class="text-[10px] text-text-muted/80">Tamaño máximo de archivo: 2MB.</p>
      </div>

      <div class="flex gap-2 w-full pt-2">
        <button
          type="button"
          (click)="triggerFileInput()"
          class="flex-1 px-3 py-1.5 rounded-lg border border-border text-xs font-semibold text-text-dark hover:bg-bg-light hover:text-primary hover:border-primary/20 transition-all cursor-pointer">
          Subir Foto
        </button>
        @if (previewFoto()) {
          <button
            type="button"
            (click)="removeFoto()"
            class="px-3 py-1.5 rounded-lg border border-border text-xs font-semibold text-text-critical hover:bg-critical-bg transition-all cursor-pointer">
            Quitar
          </button>
        }
      </div>
    </div>

    <!-- ── Formulario de Detalles ────────────────────────────────────── -->
    <div class="md:col-span-2 bg-white rounded-2xl border border-border p-6 shadow-xs">
      <form [formGroup]="perfilForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider pb-1 border-b border-border">Datos Personales</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="nombre" class="text-xs font-bold text-text-dark">Nombre Completo</label>
            <input
              id="nombre"
              type="text"
              formControlName="nombre"
              placeholder="Ej. Dr. Mario Lopez"
              class="w-full px-3 py-2 text-sm border border-border rounded-xl focus:border-primary focus:outline-none transition-colors" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-xs font-bold text-text-dark">Correo Electrónico</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="correo@ejemplo.com"
              class="w-full px-3 py-2 text-sm border border-border rounded-xl focus:border-primary focus:outline-none transition-colors" />
          </div>
        </div>

        <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider pt-2 pb-1 border-b border-border">Seguridad</h3>

        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-xs font-bold text-text-dark">Nueva Contraseña (Opcional)</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Dejar en blanco para mantener la contraseña actual"
            class="w-full px-3 py-2 text-sm border border-border rounded-xl focus:border-primary focus:outline-none transition-colors" />
        </div>

        <div class="pt-4 border-t border-border flex justify-end">
          <app-button
            type="submit"
            [disabled]="perfilForm.invalid"
            [loading]="guardando()">
            Guardar Cambios
          </app-button>
        </div>

      </form>
    </div>

  </div>

</div>
