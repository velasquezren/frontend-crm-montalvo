<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CRM Montalvo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta
      name="description"
      content="Sistema de gestión de relaciones con clientes — CRM Montalvo"
    />
    <meta name="theme-color" content="#006156" />

    <!--
      Poppins, la tipografía del manifiesto.

      Va aquí y no con un @import dentro de styles.css porque un @import encadena
      las descargas: el navegador baja y parsea la hoja entera antes de enterarse
      de que hay una fuente que pedir. Y sobre todo, así el build puede INLINEAR
      la respuesta de Google en este mismo HTML (`optimization.fonts.inline`), lo
      que elimina un viaje completo a un host nuevo — medido contra producción
      desde Bolivia, abrir una conexión TLS a un dominio de terceros cuesta ~385 ms.

      Las dos preconexiones abren el canal a gstatic (de donde sale el .woff2)
      mientras el navegador sigue leyendo el HTML, en vez de esperar a necesitarlo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />

    <!-- Favicon: navegadores modernos (SVG adaptativo) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Favicon: navegadores legacy (ICO) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Favicon: PNG 96×96 para atajos y bookmarks -->
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
    <!-- Apple Touch Icon & iOS PWA Standalone -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Montalvo CRM" />
    <meta name="application-name" content="Montalvo CRM" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Web App Manifest: PWA e instalación -->
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
