name: Calidad frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-crm-montalvo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: frontend-crm-montalvo
          persist-credentials: false
      # Enums y rutas documentadas dependen del repositorio hermano completo.
      # Se fija su SHA para que la verificación sea reproducible.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: velasquezren/backend-crm-montalvo
          ref: 21a07e2e351053c1cbd4a0aed907424b00f9b5cf
          path: backend-crm-montalvo
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-crm-montalvo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:tests
      - run: npm test -- --watch=false
